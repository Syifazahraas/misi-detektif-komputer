<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="title desc">
<title id="title">Maskot laptop detektif</title><desc id="desc">Laptop biru lucu memakai topi detektif dan membawa kaca pembesar.</desc>
<defs>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9f1ff"/><stop offset="1" stop-color="#35bde9"/></linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fdff"/><stop offset="1" stop-color="#9edcf5"/></linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd17b"/><stop offset="1" stop-color="#e58b25"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#12345a" flood-opacity=".2"/></filter>
</defs>
<ellipse cx="205" cy="390" rx="145" ry="17" fill="#12345a" opacity=".12"/>
<!-- cape --> <path d="M92 183 Q44 216 63 302 Q104 324 148 294 L173 205Z" fill="#e88d28" stroke="#12345a" stroke-width="7" stroke-linejoin="round"/>
<path d="M83 231 Q111 244 143 228" fill="none" stroke="#ffd17b" stroke-width="8" stroke-linecap="round"/>
<!-- legs --> <path d="M153 319 L143 364" stroke="#12345a" stroke-width="15" stroke-linecap="round"/><path d="M238 319 L257 364" stroke="#12345a" stroke-width="15" stroke-linecap="round"/>
<path d="M112 366 Q138 349 162 367 L163 383 Q135 394 105 382Z" fill="#f8fdff" stroke="#12345a" stroke-width="6"/><path d="M235 367 Q260 350 286 367 L295 382 Q265 395 235 382Z" fill="#f8fdff" stroke="#12345a" stroke-width="6"/>
<!-- laptop screen --> <g filter="url(#shadow)"><rect x="88" y="110" width="190" height="190" rx="22" fill="#1673b8" stroke="#12345a" stroke-width="9"/><rect x="101" y="123" width="164" height="160" rx="13" fill="url(#screen)" stroke="#eafaff" stroke-width="5"/>
<!-- face --> <ellipse cx="153" cy="190" rx="14" ry="18" fill="#fff"/><ellipse cx="157" cy="193" rx="6" ry="10" fill="#12345a"/><path d="M208 190 Q222 178 236 188" fill="none" stroke="#12345a" stroke-width="8" stroke-linecap="round"/><path d="M165 226 Q189 248 215 224" fill="none" stroke="#12345a" stroke-width="8" stroke-linecap="round"/><path d="M178 226 Q190 233 202 226" fill="#ff8b86"/>
