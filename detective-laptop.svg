<!-- detective hat --> <g filter="url(#shadow)"><path d="M95 111 Q109 48 177 43 Q242 42 269 103 L245 119 L116 126Z" fill="url(#hat)" stroke="#12345a" stroke-width="8"/><path d="M81 111 Q158 83 281 108 Q295 115 277 128 Q177 153 83 132 Q65 124 81 111Z" fill="#d97820" stroke="#12345a" stroke-width="8"/><path d="M121 68 L238 102 M173 46 L185 112" stroke="#f6b34d" stroke-width="7" opacity=".8"/></g>
<!-- left arm --> <path d="M91 205 Q47 202 42 240" fill="none" stroke="#12345a" stroke-width="13" stroke-linecap="round"/><path d="M43 235 Q23 233 22 251 Q28 270 48 263 L61 249Z" fill="#fff" stroke="#12345a" stroke-width="6"/>
<!-- magnifying glass arm --> <path d="M278 202 Q310 195 326 218" fill="none" stroke="#12345a" stroke-width="13" stroke-linecap="round"/><path d="M323 217 L343 236" stroke="#d97820" stroke-width="14" stroke-linecap="round"/><circle cx="350" cy="178" r="45" fill="#eafaff" stroke="#e58b25" stroke-width="13"/><circle cx="350" cy="178" r="33" fill="#83e4fa" stroke="#fff" stroke-width="5"/><path d="M332 157 Q348 143 365 157" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
<!-- badge --> <rect x="108" y="260" width="40" height="31" rx="8" fill="#ffb84d" stroke="#12345a" stroke-width="5"/><path d="M118 275 H138" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<!-- sparkles --> <path d="M300 76 L314 56 M318 87 L340 78 M71 79 L58 63" stroke="#ff9d24" stroke-width="8" stroke-linecap="round"/>
</svg>
